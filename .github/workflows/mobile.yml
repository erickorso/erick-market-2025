name: Mobile

# Two jobs with very different requirements. The check needs nothing and runs
# on every change to the app; the APK needs an Expo account, so it only runs
# when someone asks for it or cuts a tag.
on:
  push:
    branches: [main]
    paths: ["mobile/**", "services/**", "types.ts", "constants.ts", "data/**"]
  pull_request:
    paths: ["mobile/**", "services/**", "types.ts", "constants.ts", "data/**"]
  workflow_dispatch:
    inputs:
      release:
        description: "Build an APK and attach it to a release"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 20,
            cache: npm,
            cache-dependency-path: mobile/package-lock.json,
          }
      - run: npm ci
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile
      # The check that would have caught the blank-screen release: typecheck
      # and bundle both only look at JavaScript, so a native peer dependency
      # that is declared but never installed compiles perfectly and then dies
      # on a device outside Expo Go.
      - run: npx expo-doctor@latest
        working-directory: mobile
      # Renders the app. Everything above only reads it — three startup
      # failures reached a device while typecheck, bundle and doctor were all
      # green, because none of them mount a component.
      - run: npm test
        working-directory: mobile
      # The check that matters: this is the same command EAS runs inside the
      # Android build, so a green bundle here means the APK will compile.
      - run: npm run bundle
        working-directory: mobile

  apk:
    # Needs EXPO_TOKEN, which forks and most runs do not have. Skipping is the
    # right outcome there — failing would make the badge lie about the code.
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    needs: check
    # softprops/action-gh-release needs this; default GITHUB_TOKEN is read-only
    # and fails with "Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
        working-directory: mobile
      # `--output` is a local-build flag: a remote build leaves the artifact on
      # Expo's servers and hands back a URL, so the download is a second step.
      # --json keeps stdout pure, with the progress log going to stderr.
      - name: Build the APK
        working-directory: mobile
        run: eas build --platform android --profile preview --non-interactive --wait --json > build.json
      - name: Download it
        working-directory: mobile
        run: |
          url=$(node -e '
            const b = require("./build.json");
            const build = Array.isArray(b) ? b[0] : b;
            const a = build?.artifacts ?? {};
            const url = a.applicationArchiveUrl ?? a.buildUrl;
            if (!url) {
              console.error(JSON.stringify(build, null, 2));
              throw new Error("the build returned no artifact URL");
            }
            process.stdout.write(url);
          ')
          echo "artifact: $url"
          curl -fSL -o ../erick-market.apk "$url"
          ls -l ../erick-market.apk
      # Keep the APK even if the release step fails (permissions / API blip).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: erick-market-apk
          path: erick-market.apk
          if-no-files-found: error
      - name: Publish it as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ github.run_number }}
          name: Erick Market mobile ${{ github.run_number }}
          body: |
            Android APK — install directly, no store account needed.

            Points at the production API. iOS cannot be side-loaded this way;
            that route is TestFlight.
          files: erick-market.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
