<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0f172a" />
    <title>Erick Market — Trading Simulator</title>
    <meta
      name="description"
      content="Erick Market — a trading simulator with live US quotes, a persisted portfolio and a monthly league. React, TypeScript, Vercel serverless and Neon Postgres. Portfolio demo by Erick Vargas Ramos."
    />
    <meta name="author" content="Erick Vargas Ramos" />
    <meta property="og:title" content="Erick Market — Trading Simulator" />
    <meta
      property="og:description"
      content="React · TypeScript · Vercel serverless · Neon Postgres. Server-priced trades with exactly-once settlement."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("erick-market.theme");
          if (t !== "light") document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
